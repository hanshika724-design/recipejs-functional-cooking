<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeJS - Functional Cooking Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>RecipeJS</h1>

  <!-- Control Buttons -->
  <div class="controls">
    <div class="filter-buttons">
      <button class="active" data-filter="all">Show All</button>
      <button data-filter="easy">Easy</button>
      <button data-filter="medium">Medium</button>
      <button data-filter="hard">Hard</button>
      <button data-filter="quick">Quick Recipes (&lt;30 min)</button>
    </div>
    <div class="sort-buttons">
      <button class="active" data-sort="none">Default Order</button>
      <button data-sort="name">Name (A-Z)</button>
      <button data-sort="time">Time (Fastest First)</button>
    </div>
  </div>

  <!-- Recipe Container -->
  <div id="recipe-container"></div>

  <script src="app.js"></script>
</body>
</html>
